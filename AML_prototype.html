<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nordisk AML · Interaktiv konseptskisse</title><style>
:root{--ink:#172e3a;--mut:#4b6570;--teal:#08655d;--line:#cedddc;--pale:#e6f4ef;--bg:#f3f7f6}*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg)}header{background:white;padding:16px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.logo{font-size:19px;font-weight:750;letter-spacing:-.5px}.mark{background:var(--teal);color:white;border-radius:8px;padding:6px 11px;font-weight:800}.demo{margin-left:auto;color:var(--mut);font-size:13px}main{max-width:1110px;margin:28px auto;padding:0 25px}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:24px}button,select{font:inherit;padding:7px 13px;border:1px solid #abbdba;background:white;color:var(--ink);border-radius:7px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ad6525;outline-offset:2px}button.on,.primary{background:var(--teal);color:white;border-color:var(--teal)}h1{font-size:34px;line-height:1.15;margin:7px 0}h2{font-size:19px;margin:0 0 12px}.sub{color:var(--mut);margin:7px 0 17px}.cap{font-size:12px;letter-spacing:1.2px;color:var(--teal);font-weight:780}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.card,article{border:1px solid var(--line);background:white;border-radius:10px;padding:16px 18px}.number{font-size:27px;font-weight:750;color:var(--teal)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}.row{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #dde7e5}.end{margin-left:auto}.badge{font-size:13px;font-weight:650;padding:4px 8px;border-radius:5px;background:var(--pale);color:#075e53}.warn{background:#fff1d7;color:#75460c}.mut{font-size:14px;color:var(--mut)}.bold{font-weight:700}.step{padding:8px 0}.form{margin:10px 0;border:1px solid var(--line);border-radius:6px;padding:10px;width:100%;font:inherit}.note{background:#e7f3f0;padding:12px 14px;border-radius:8px;margin:12px 0}.tiny{font-size:12px;color:var(--mut);padding:14px 0}label{display:block}.sr{position:absolute;left:-9999px}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.row{flex-wrap:wrap}main{margin-top:18px}.demo{max-width:145px}.cards{gap:5px}.card{padding:8px}.number{font-size:22px}}
</style><header><span class="mark">N</span><span class="logo">Nordisk AML</span><span class="demo">Designprototype · kun fiktive data</span></header><main><nav id="nav" aria-label="Eksempelvisninger"></nav><section id="app" aria-live="polite"></section><footer class="tiny">Lokal demonstrasjon. Ingen registeroppslag, lagring eller sending. Fanene simulerer ulike roller.</footer></main><script>
const views=['Arbeidskø','Kontrollgrunnlag','Bevis og historikk','Kundeportal'];let v=0,idx=0,f='Alle',assigned=[false,false,false],replied=false;const rows=[['Kystlinje Eksempel AS','Norsk foretak','Uavklart eierskap','Eierdokumentasjon','Å avklare'],['Sund Eksempel AB','Svensk foretak','Klar for faglig vurdering','Sluttvurdering','Klar'],['Eng Eksempel ApS','Dansk foretak','Venter på kilde','Nytt registeroppslag','Venter']];function btn(s,fn,cl=''){let b=document.createElement('button');b.textContent=s;b.onclick=fn;b.className=cl;return b}function view(i){v=i;draw()}function el(id){return document.getElementById(id)}function draw(){let n=el('nav');n.replaceChildren();views.forEach((s,i)=>{let b=btn(s,()=>view(i),v===i?'on':'');b.setAttribute('aria-current',v===i?'page':'false');n.append(b)});let x=rows[idx],app=el('app');if(v==0){app.innerHTML=`<div class="cap">SAKSBEHANDLER / DAGENS ARBEID</div><h1>Arbeidskø</h1><p class="sub">Se hva som krever vurdering, og hvorfor.</p><div class="cards"><div class="card"><div class="number">3</div>Åpne kontroller</div><div class="card"><div class="number">1</div>Klar til vurdering</div><div class="card"><div class="number">1</div>Venter på kilde</div></div><article><label>Vis status <select id="filter"></select></label><div id="items"></div></article>`;let s=el('filter');['Alle','Å avklare','Klar','Venter'].forEach(a=>s.add(new Option(a,a)));s.value=f;s.onchange=()=>{f=s.value;draw()};rows.forEach((r,i)=>{if(f!='Alle'&&r[4]!=f)return;let a=document.createElement('div');a.className='row';a.innerHTML=`<div><span class="bold">${r[0]}</span><br><span class="mut">${r[1]}</span></div><span class="end badge ${r[4]=='Klar'?'':'warn'}">${r[2]}</span>`;a.append(btn('Åpne',()=>{idx=i;view(1)}));el('items').append(a)})}else if(v===1){app.innerHTML=`<div class="cap">SAKSBEHANDLER / SAK 10${idx+1}</div><h1>${x[0]}</h1><p class="sub">${x[1]} · Kontrollgrunnlag for oppdraget</p><div class="grid"><article><h2>Kontroller</h2>${[['Identitet og fullmakt','Verifisert'],['Formål med oppdrag','Registrert'],['Eierskap',idx===0?'Mangler vedlegg':idx===2?'Venter på kilde':'Dokumentert'],['Sluttvurdering','Ikke besluttet']].map(a=>`<div class="row">${a[0]}<span class="end badge ${a[1]=='Verifisert'||a[1]=='Registrert'||a[1]=='Dokumentert'?'':'warn'}">${a[1]}</span></div>`).join('')}</article><article><div class="cap">NESTE HANDLING</div><h2>${x[3]}</h2><p>${['Fullmakten er bekreftet. Ett ledd i eierkjeden mangler dokumentasjon.','Kontrollene er ferdige. Vurder oppdraget før det inngås et kundeforhold.','Registerkilden ga ikke gyldig svar. Saken er ikke ferdig kontrollert.'][idx]}</p><div id="action"></div><div id="hist" style="margin-top:10px"></div></article></div>`;el('action').append(btn(assigned[idx]?'Tildelt deg':'Ta ansvar for oppgaven',()=>{assigned[idx]=true;draw()},'primary'));el('hist').append(btn('Vis bevis og historikk',()=>view(2)))}else if(v===2){app.innerHTML=`<div class="cap">INTERN VISNING / KONTROLLBEVIS</div><h1>Bevis og historikk</h1><p class="sub">${x[0]} · Fiktivt kontrolløyeblikk</p><article><h2>Hva bygger kontrollen på?</h2><div class="row"><b>09:00</b> Oppdrag registrert <span class="end badge">Saksbehandler</span></div><div class="row"><b>09:02</b> Identitet og fullmakt bekreftet <span class="end badge">Demo-eID · v1</span></div><div class="row"><b>09:03</b> ${x[2]} <span class="end badge warn">Regelpakke · demo 1.0</span></div>${assigned[idx]?'<div class="row"><b>Nå</b> Oppgave tildelt deg</div>':''}</article>`}else{app.innerHTML=`<div class="cap">SELVBETJENING / FIKTIV KUNDE</div><h1>Opplysninger om oppdraget</h1><p class="sub">Kystlinje Eksempel AS · Kundevisning adskilt fra internkontrollen</p><article><h2>${replied?'Svaret er registrert i demoen':'Bekreft dokumentasjon'}</h2><p>${replied?'Du trenger ikke gjøre noe mer i denne demonstrasjonen.':'Vi trenger oppdatert dokumentasjon på hvem som kontrollerer selskapet. Her simuleres innsending uten ekte dokumenter.'}</p><div id="portalaction"></div></article>`;el('portalaction').append(btn(replied?'Tilbakestill demo':'Send eksempelbekreftelse',()=>{replied=!replied;draw()},'primary'))}}draw();</script></html>
